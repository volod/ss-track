[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "ss-track"
version = "0.1.0"
description = "Benchmark, data factory, and reference perception stack for resource-aware object tracking on autonomous and assisted robots"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Project Contributors" }]
keywords = ["benchmark", "object-tracking", "perception", "robotics", "sensor-fusion"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "av==19.0.2",
  "jsonschema>=4.25,<5",
  "numpy>=2.1,<3",
  "pyyaml>=6.0.3,<7",
  "referencing>=0.36,<1",
]

[project.optional-dependencies]
dev = [
  "complexipy==6.0.0",
  "jsoncompat==0.5.0",
  "mypy>=1.15,<2",
  "pymarkdownlnt>=0.9.32,<1",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "radon==6.0.1",
  "ruff>=0.11,<0.17",
  "setuptools>=80",
  "shellcheck-py==0.11.0.1",
  "types-jsonschema>=4.25,<5",
  "types-pyyaml>=6.0.12,<7",
]
croissant = [
    "mlcroissant==1.1.1",
]

[project.scripts]
ss-track = "ss_track.cli:main"
ss-track-plan = "ss_track.quality.plan_summary:main"

[project.urls]
Documentation = "https://github.com/volod/ss-track/blob/main/docs/README.md"
Repository = "https://github.com/volod/ss-track"

# Root `contracts/` ships as a package, which a mapping can only add to an explicit list.
# tests/schema/test_packaging.py fails when a package is missing here.
[tool.setuptools]
include-package-data = false
packages = [
  "ss_track",
  "ss_track.commands",
  "ss_track.contract_files",
  "ss_track.core",
  "ss_track.corpus",
  "ss_track.corpus.bundles",
  "ss_track.corpus.cases",
  "ss_track.corpus.declarations",
  "ss_track.corpus.decoding",
  "ss_track.corpus.descriptors",
  "ss_track.corpus.discovery",
  "ss_track.corpus.hosts",
  "ss_track.corpus.records",
  "ss_track.corpus.sources",
  "ss_track.corpus.storage",
  "ss_track.corpus.versions",
  "ss_track.quality",
  "ss_track.schema",
  "ss_track.schema.compatibility",
  "ss_track.schema.registry",
  "ss_track.schema.validation",
  "ss_track.schema.views",
]

[tool.setuptools.package-dir]
"" = "src"
"ss_track.contract_files" = "contracts"

[tool.setuptools.package-data]
"ss_track.contract_files" = ["*.md", "*.yaml", "**/*.json", "**/*.md", "**/*.txt"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
files = ["src/ss_track"]
check_untyped_defs = true
disallow_any_generics = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
warn_unreachable = true
pretty = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["ss_track"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
  "if __name__ == .__main__.:",
]

[tool.pymarkdown]
extensions.markdown-tables.enabled = true
plugins.MD013.line_length = 100
plugins.MD013.code_block_line_length = 100
plugins.MD013.heading_line_length = 100
plugins.MD013.tables = false
plugins.MD022.enabled = false
plugins.MD024.enabled = false
plugins.MD032.enabled = false
plugins.MD040.enabled = false
